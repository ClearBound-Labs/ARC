[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-training"
version = "5.2.0.post3"
description = "Automatic Recovery Controller - Auto-detect and recover from neural network training failures"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Aryan Kaushik", email = "a.kaushik0908@gmail.com"},
    {name = "Mitul Gupta", email = "mitul@clearboundlabs.com"}
]
keywords = [
    "deep-learning",
    "pytorch",
    "training",
    "fault-tolerance",
    "nan-recovery",
    "checkpointing",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
hf = [
    "transformers>=4.44",
    "accelerate>=0.33",
]
lightning = [
    "lightning>=2.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://arc.clearboundlabs.com"
Documentation = "https://arc.clearboundlabs.com/docs"
Repository = "https://github.com/ClearBound-Labs/ARC"
Changelog = "https://github.com/ClearBound-Labs/ARC/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["arc*"]

[tool.setuptools.package-data]
arc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # legacy APIs exercised on purpose by their own tests
    "ignore:(SelfHealingArc|LiteArc) is a legacy API:FutureWarning",
]
